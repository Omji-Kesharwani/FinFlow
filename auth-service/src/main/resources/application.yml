server:
  port: 8081

spring:
  application:
    name: auth-service
  jackson:
    time-zone: Asia/Kolkata

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view : false


  flyway:
    enabled: true
    locations: classpath:db/migration


management:
  endpoints:
    web:
      exposure:
        include: health , info


jwt:
  secret: ${JWT_SECRET}
  expiration : 3600000
