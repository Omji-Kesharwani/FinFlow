server:
  port: 8080

spring:
  data:
    redis:
      host: redis
      port: 6379

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: auth-service
              uri: http://auth-service:8081
              predicates:
                - Path=/api/auth/login,/api/auth/register

            - id: user-service
              uri: http://user-service:8082
              predicates:
                - Path=/api/users/**

            - id: wallet-service
              uri: http://wallet-service:8083
              predicates:
                - Path=/api/wallets/**

            - id: payment-service
              uri: http://payment-service:8084
              predicates:
                - Path=/api/payments/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: paymentCircuitBreaker
                    fallbackUri: "forward:/gateway-error"

            - id: notification-service
              uri: http://notification-service:8085
              predicates:
                - Path=/api/notifications/**