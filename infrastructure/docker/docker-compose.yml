services:

  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:17
    container_name: finflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: finflow
      POSTGRES_PASSWORD: finflow
      POSTGRES_DB: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finflow -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - finflow-network


  # ============================================================
  # Kafka
  # ============================================================
  kafka:
    image: apache/kafka:latest
    container_name: finflow-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 15s
      timeout: 10s
      retries: 5

    networks:
      - finflow-network


  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7
    container_name: finflow-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - finflow-network

  auth-service:
    image: finflow-auth-service:latest
    container_name: finflow-auth-service

    ports:
      - "8081:8081"

    env_file:
      - ./.env.docker

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - finflow-network

  user-service:
    image: finflow-user-service:latest
    container_name: finflow-user-service
    restart: unless-stopped

    ports:
      - "8082:8082"

    env_file:
      - ./.env.docker

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - finflow-network

  wallet-service:
    image: finflow-wallet-service:latest
    container_name: finflow-wallet-service
    restart: unless-stopped

    ports:
      - "8083:8083"

    env_file:
      - ./.env.docker

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - finflow-network

  payment-service:
    image: finflow-payment-service:latest
    container_name: finflow-payment-service
    restart: unless-stopped

    ports:
      - "8084:8084"

    env_file:
      - ./.env.docker

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

    networks:
      - finflow-network

  notification-service:
    image: finflow-notification-service:latest
    container_name: finflow-notification-service
    restart: unless-stopped

    ports:
      - "8085:8085"

    env_file:
      - ./.env.docker

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

    networks:
      - finflow-network

  gateway-service:
    image: finflow-gateway-service:latest
    container_name: finflow-gateway-service
    restart: unless-stopped

    ports:
      - "8080:8080"

    env_file:
      - ./.env.docker

    environment:
      SPRING_PROFILES_ACTIVE : docker

    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      wallet-service:
        condition: service_started
      payment-service:
        condition: service_started
      notification-service:
        condition: service_started
      redis:
        condition: service_healthy

    networks:
      - finflow-network

# ==============================================================
# Persistent Volumes
# ==============================================================
volumes:
  postgres_data:
    name: finflow-postgres-data

  redis_data:
    name: finflow-redis-data


# ==============================================================
# Network
# ==============================================================
networks:
  finflow-network:
    name: finflow-network
    driver: bridge