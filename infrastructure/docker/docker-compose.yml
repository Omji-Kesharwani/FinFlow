services:
  postgres:
    image: postgres:17
    container_name: finflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER : finflow
      POSTGRES_PASSWORD : finflow
      POSTGRES_DB : auth_db

    ports :
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: