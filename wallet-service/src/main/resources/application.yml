server:
  port: 8083

spring:
  application:
    name: wallet-service

  datasource:
    url : ${WALLET_DB_URL}
    username: ${DB_USERNAME}
    password : ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto : validate
    open-in-view: false

  flyway:
      enabled : true
      locations : classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    org.springframework.security: DEBUG
